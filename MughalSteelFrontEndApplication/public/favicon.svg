<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805A10" />
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>
  </defs>

  <!-- Outer Octagonal Shield -->
  <polygon points="100,8 165,35 192,100 165,165 100,192 35,165 8,100 35,35" 
           fill="url(#steelDark)" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Inner Geometric Border -->
  <polygon points="100,18 157,42 182,100 157,158 100,182 43,158 18,100 43,42" 
           fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />

  <!-- Architectural Gate Arch & Monogram M -->
  <!-- Arch Dome -->
  <path d="M60,135 V85 C60,50 140,50 140,85 V135" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Center Keystone / Spire -->
  <path d="M100,32 L105,48 L100,54 L95,48 Z" fill="url(#goldGrad)" />
  <line x1="100" y1="54" x2="100" y2="70" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Monogram M Pillars -->
  <path d="M72,135 V85 L100,115 L128,85 V135" 
        fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Decorative Gate Bars -->
  <line x1="86" y1="110" x2="86" y2="135" stroke="url(#goldGrad)" stroke-width="2.5" />
  <line x1="100" y1="120" x2="100" y2="135" stroke="url(#goldGrad)" stroke-width="2.5" />
  <line x1="114" y1="110" x2="114" y2="135" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Bottom Pedestal & Foundation -->
  <rect x="52" y="135" width="96" height="7" rx="2" fill="url(#goldGrad)" />
  <rect x="46" y="144" width="108" height="5" rx="1" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Stars of Excellence -->
  <polygon points="100,155 102,160 107,160 103,163 105,168 100,165 95,168 97,163 93,160 98,160" fill="url(#goldGrad)" />
  <polygon points="80,155 81.5,159 85,159 82,161.5 83.5,165 80,163 76.5,165 78,161.5 75,159 78.5,159" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="120,155 121.5,159 125,159 122,161.5 123.5,165 120,163 116.5,165 118,161.5 115,159 118.5,159" fill="url(#goldGrad)" opacity="0.8" />
</svg>